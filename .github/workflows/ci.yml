name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Expo doctor
        run: npx --yes expo-doctor@latest
      - name: Bundle de Android
        run: npx expo export --platform android --output-dir dist
        env:
          # Valores ficticios: solo se compila el JS, no se conecta a Supabase.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
